name: Self Check

# Guards the shared toolchain itself: a broken config or workflow here breaks every consumer.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: actionlint
        # Validates workflow + composite-action YAML and shellchecks their embedded run: scripts.
        uses: raven-actions/actionlint@v2

      - name: shellcheck git hooks
        run: shellcheck harness/.githooks/pre-commit harness/.githooks/pre-push

      - name: py_compile the explain-diff renderer
        # explain-it finalize shells out to this script — an undeclared python3 dependency, so at
        # least confirm it's syntactically valid on every PR. test/skills/render.test.ts covers
        # actual output; this only catches "doesn't parse".
        run: python3 -m py_compile harness/skills/explain-it/scripts/render.py

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Committed dist/ must match the build
        # Consumers install dist/ from the git tag — a stale commit ships broken runtime.
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            git status --porcelain dist/
            echo "::error::dist/ is stale — run 'npm run build' and commit the result"
            exit 1
          fi

      - run: npm run check:ci
      - run: npm run test:coverage

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      # Compiles the fixture card through the actual exported configs — catches a breaking
      # change to rollup/tsconfig/vitest/globals before a consumer does.
      - run: npm run smoke
