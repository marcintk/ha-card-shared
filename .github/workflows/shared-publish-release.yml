name: Publish Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag
        id: tag
        uses: marcintk/ha-card-shared/.github/actions/validate-tag@main

      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build production bundle
        run: npm run build:prod
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Derive bundle name from package.json
        id: name
        # Named explicitly rather than globbing dist/ — a wrong filename must fail the
        # release, not ship a mystery asset. HACS resolves it via hacs.json "filename".
        run: echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/${{ steps.name.outputs.name }}.js
          generate_release_notes: true
          draft: true # always a draft — a human publishes from the Releases UI after review
          prerelease: ${{ steps.tag.outputs.is_prerelease }}
